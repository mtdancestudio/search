<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT DANCE STUDIO | 查詢系統</title>
    <style>
        :root {
            --bg-color: #0a192f;
            --card-bg: rgba(16, 39, 74, 0.65);
            --primary-blue: #007bff;
            --neon-cyan: #00f0ff;
            --neon-pink: #ff4081;
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #060d1a 0%, #0a192f 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 背景霓虹光暈裝飾 */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.4;
        }
        body::before { top: -50px; left: -50px; background: var(--primary-blue); }
        body::after { bottom: -50px; right: -50px; background: var(--neon-pink); }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 123, 255, 0.2);
            z-index: 1;
            text-align: center;
            position: relative;
        }
        
        .logo-main { font-size: 42px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ffffff 30%, var(--neon-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        .logo-sub {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--neon-pink);
            margin-top: 5px;
            font-weight: 700;
        }
        
        /* 增加 margin 解決擁擠問題 */
        input { 
            width: 100%; padding: 20px; margin: 15px 0; border-radius: 12px; 
            border: 1px solid #333; background: #172a45; color: white; 
            font-size: 18px; text-align: center; box-sizing: border-box;
        }
        button { 
            width: 100%; padding: 20px; margin-top: 30px; 
            background: var(--neon-cyan); color: #000; border: none; 
            border-radius: 12px; font-weight: bold; font-size: 20px; cursor: pointer; 
        }

        /* 查詢結果區 (初始為空) */
        #result { margin-top: 40px; padding: 30px; border: 2px solid var(--neon-cyan); border-radius: 20px; display: none; background: rgba(255,255,255,0.05); }
        .label { font-size: 18px; color: #cbd5e1; }
        .count-num { font-size: 72px; color: var(--neon-cyan); font-weight: 900; margin: 10px 0; display: block; }
        .expiry-date { color: var(--neon-pink); font-weight: bold; font-size: 28px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-main">MT</div>
    <div class="logo-sub">DANCE STUDIO</div>
    
    <input type="text" id="name" placeholder="請輸入姓名">
    <input type="number" id="phone" placeholder="請輸入手機末三碼">
    <button id="btn" onclick="query()">查詢剩餘課程</button>

    <div id="result"></div>
</div>

<script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx2Ze8pzjpM6Hks71TAOUvum5gpr6H-MeqArUQOHYSfbL_XiLbI7hoDtuI__htcACeb/exec"; 

    function sendJsonpRequest(url, callbackName) {
        return new Promise((resolve) => {
            window[callbackName] = (data) => {
                delete window[callbackName];
                document.body.removeChild(script);
                resolve(data);
            };
            const script = document.createElement('script');
            script.src = `${url}${url.includes('?') ? '&' : '?'}callback=${callbackName}`;
            document.body.appendChild(script);
        });
    }

    async function query() {
        const btn = document.getElementById('btn');
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const resultDiv = document.getElementById('result');

        if (!name || !phone) { alert("請填寫姓名與手機末三碼"); return; }

        btn.innerText = "查詢中...";
        btn.disabled = true;

        try {
            const url = `${GAS_API_URL}?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`;
            const data = await sendJsonpRequest(url, "jsonp_" + Date.now());

            if (data.status === "success") {
    let rawDate = String(data.expiry);
    
    // 使用 .replace()：把從 T 開始後面所有的東西都換成「空字串」
    // 這個正規表示式 /T.*$/ 的意思是：找到 T 以及它後面所有的文字
    let cleanDate = rawDate.replace(/T.*$/, "");
                // 動態渲染 HTML：數字放大、日期標紅
                resultDiv.innerHTML = `
        <div class="label">剩餘堂數</div>
        <div class="count-num">${data.remaining}</div>
        <div class="label">到期日期</div>
        <div class="expiry-date">${cleanDate}</div>
    `;
    resultDiv.style.display = 'block';
    console.log("現在的版本是：2026-05-29-V2");
            } else {
                resultDiv.style.display = 'none';
                alert("查無資料");
            }
        } catch (err) {
            alert("連線失敗，請稍後再試");
        } finally {
            btn.innerText = "查詢剩餘課程";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
