<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT DANCE STUDIO | 查詢系統</title>

<style>
:root {
    --neon-cyan: #00f0ff;
    --neon-pink: #ff4081;
    --bg-dark: #0a192f;
    --card: rgba(255,255,255,0.06);
}

body {
    background: var(--bg-dark);
    color: white;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 450px;
    text-align: center;
}

/* ⭐ LOGO（保留兩行） */
.logo-main {
    font-size: 72px;
    font-weight: 900;
    background: linear-gradient(to right, #fff, var(--neon-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.logo-sub {
    font-size: 20px;
    color: var(--neon-pink);
    letter-spacing: 6px;
    margin-bottom: 40px;
    font-weight: 700;
}

/* INPUT */
input {
    width: 100%;
    padding: 18px;
    margin: 10px 0;
    border-radius: 12px;
    border: 1px solid #333;
    background: #172a45;
    color: white;
    font-size: 16px;
    text-align: center;
    box-sizing: border-box;
}

/* BUTTON */
button {
    width: 100%;
    padding: 18px;
    margin-top: 20px;
    background: var(--neon-cyan);
    color: #000;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
}

button:disabled {
    opacity: 0.6;
}

button:active {
    transform: scale(0.98);
}

/* RESULT CARD */
#result {
    margin-top: 35px;
    padding: 28px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid rgba(0,240,255,0.3);
    display: none;
    backdrop-filter: blur(10px);
}

/* LABEL */
.label {
    font-size: 14px;
    color: #94a3b8;
    margin-top: 12px;
}

/* 大數字 */
.count-num {
    font-size: 68px;
    font-weight: 900;
    color: var(--neon-cyan);
    margin: 10px 0;
}

/* 到期 */
.expiry-date {
    font-size: 30px;
    font-weight: 800;
    color: var(--neon-pink);
    margin-top: 5px;
}

/* hint */
.hint {
    font-size: 12px;
    color: #64748b;
    margin-top: 15px;
}

/* loading feeling */
.loading {
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="container">

    <!-- ⭐ LOGO（兩行保留） -->
    <div class="logo-main">MT</div>
    <div class="logo-sub">DANCE STUDIO</div>

    <input type="text" id="name" placeholder="請輸入姓名">
    <input type="number" id="phone" placeholder="請輸入手機末三碼">

    <button id="btn" onclick="query()">查詢剩餘課程</button>

    <div id="result"></div>

</div>

<script>
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx2Ze8pzjpM6Hks71TAOUvum5gpr6H-MeqArUQOHYSfbL_XiLbI7hoDtuI__htcACeb/exec";

/* ⭐ JSONP 核心 */
function sendJsonpRequest(url) {
    return new Promise((resolve) => {

        const callbackName = "cb_" + Date.now();

        window[callbackName] = function (data) {
            delete window[callbackName];
            script.remove();
            resolve(data);
        };

        const script = document.createElement('script');
        script.src = url + "&callback=" + callbackName;

        document.body.appendChild(script);
    });
}

async function query() {

    const btn = document.getElementById('btn');
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const resultDiv = document.getElementById('result');

    if (!name || !phone) {
        alert("請填寫姓名與手機末三碼");
        return;
    }

    btn.innerText = "查詢中...";
    btn.disabled = true;

    try {

        const url =
            GAS_API_URL +
            "?name=" + encodeURIComponent(name) +
            "?phone=" + encodeURIComponent(phone);

        const data = await sendJsonpRequest(url);

        if (data.status === "success") {

            resultDiv.innerHTML = `
                <div class="label">剩餘堂數</div>
                <div class="count-num">${data.remaining ?? "-"}</div>

                <div class="label">到期日期</div>
                <div class="expiry-date">${data.expiry ? data.expiry : "-"}</div>

                <div class="hint">請以實際上課紀錄為準</div>
            `;

            resultDiv.style.display = 'block';

        } else {
            resultDiv.style.display = 'none';
            alert("查無資料");
        }

    } catch (err) {
        alert("連線失敗，請稍後再試");
    }

    btn.innerText = "查詢剩餘課程";
    btn.disabled = false;
}
</script>

</body>
</html>
